name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages へのデプロイは同時に1つだけ。進行中のものは待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build
        # GitHub Pages はリポジトリ名がURLのパスに入るため base を合わせる
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # 【初回のみ手作業が要る】
      # リポジトリ設定 → Pages → Build and deployment → Source を
      # "GitHub Actions" にしておくこと。未設定だとここで
      # "Get Pages site failed" となり以降のステップが飛ぶ。
      #
      # enablement: true で自動作成も試すが、Actions の既定トークンには
      # Pages を新規作成する権限が無く "Resource not accessible by
      # integration" で失敗する。有効化後はこの指定は素通りする。
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
